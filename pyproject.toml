[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-embryo-models"
version = "0.1.0"
description = "Training, inference and evaluation of temporal, spatial and perturbation embryo models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.6,<3",
  "scikit-learn>=1.4,<2",
  "anndata>=0.10,<0.12",
  "h5py>=3.10,<4",
  "joblib>=1.3,<2",
  "threadpoolctl>=3,<4",
  "pandas>=2,<3",
  "requests>=2.32,<3",
  "veckit==0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
